<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK-Login (No Password)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ZK-Login</h1>
        <p class="subtitle">Mô hình xác thực không truyền mật khẩu qua mạng</p>

        <div class="card">
            <h2>Challenge Code</h2>
            <div id="challengeBox" class="challenge-box">Loading...</div>
            <button id="refreshChallengeBtn" class="secondary-btn">Lấy mã mới</button>
        </div>

        <div class="forms-container">
            <!-- ĐĂNG KÝ -->
            <div class="form-section">
                <h2>1. Đăng ký</h2>
                <p>Upload file <code>register_data.json</code></p>
                <form id="registerForm">
                    <input type="file" id="registerFile" accept=".json" required>
                    <button type="submit" class="primary-btn">Submit</button>
                </form>
            </div>

            <div class="divider"></div>

            <!-- ĐĂNG NHẬP -->
            <div class="form-section">
                <h2>2. Đăng nhập</h2>
                <p>Upload file <code>login_proof.json</code></p>
                <form id="loginForm">
                    <input type="file" id="loginFile" accept=".json" required>
                    <button type="submit" class="primary-btn">Login</button>
                </form>
            </div>
        </div>

        <div id="messageBox" class="message-box hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
